name: super_sustainable_urban_planner
description: 'Sustainable Urban Planner portal built with Flutter web.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.1
  supabase_flutter: ^2.6.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  pdf: ^3.11.0
  printing: ^5.12.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/


